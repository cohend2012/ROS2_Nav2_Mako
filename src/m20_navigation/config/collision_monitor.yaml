# Nav2 collision_monitor: the last safety layer before the bridge, for EVERY mode
# (classical Nav2 or the learned controller). Chain:
#   controller/ai -> /cmd_vel_nav -> velocity_smoother -> /cmd_vel_smoothed
#   -> collision_monitor -> /cmd_vel -> bridge (watchdog) -> robot
# Zones are body-frame polygons around the measured 0.91 x 0.53 m footprint.
# Humble parameter names (max_points; 'approach' action is not in Humble).
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 2.0          # scan older than this -> treated as invalid -> stop
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:                 # 4-6 cm outside the body, all round
      type: "polygon"
      points: [0.52, 0.31, 0.52, -0.31, -0.50, -0.31, -0.50, 0.31]
      action_type: "stop"
      max_points: 3
      visualize: false
      polygon_pub_topic: "polygon_stop"
    PolygonSlow:                 # 0.35 m ahead: halve speed (doors, people stepping in)
      type: "polygon"
      points: [0.85, 0.36, 0.85, -0.36, 0.50, -0.36, 0.50, 0.36]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.5
      visualize: false
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
