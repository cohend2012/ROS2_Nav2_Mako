# NavFn + RotationShim -> Regulated Pure Pursuit (office). See README.md.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.6        # rad: rotate in place first when the path is this far off
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 4.0             # skid-scrub stiction punch-through (see base params)
      simulate_ahead_time: 1.0
      # --- RPP (primary) ---
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      use_rotate_to_heading: false       # the shim does it
      allow_reversing: false
      use_collision_detection: true      # footprint vs costmap along the arc
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.12
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0  # = office inflation layer
      max_robot_pose_search_dist: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      # RPP's footprint collision check on a 0.10 m grid with 0.03 m padding flagged
      # "collision ahead" at every 0.85 m door (0.16 m a side): 176-292 detections,
      # then 'patience exceeded' (office smoke 2026-11-05). Finer grid, no padding;
      # the inflation layer still adds clearance cost.
      resolution: 0.05
      footprint_padding: 0.0
