# Smac Lattice (diff-drive primitives, footprint collision checking) + RotationShim -> RPP.
# Lattice primitives are 0.05 m, so the GLOBAL costmap must be 0.05 m here.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerLattice"
      lattice_filepath: "{share:nav2_smac_planner}/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true
      tolerance: 0.25
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 4.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      allow_reverse_expansion: false
      smooth_path: true
global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.05
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 4.0
      simulate_ahead_time: 1.0
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      use_rotate_to_heading: false
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.12
      cost_scaling_dist: 0.5
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      max_robot_pose_search_dist: 10.0
local_costmap:
  local_costmap:
    ros__parameters:
      # RPP's footprint collision check on a 0.10 m grid with 0.03 m padding flagged
      # "collision ahead" at every 0.85 m door (0.16 m a side): 176-292 detections,
      # then 'patience exceeded' (office smoke 2026-11-05). Finer grid, no padding;
      # the inflation layer still adds clearance cost.
      resolution: 0.05
      footprint_padding: 0.0
