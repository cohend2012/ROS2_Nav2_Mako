# M20 Nav2 config (Phase 3, Step A). Localization via slam_toolbox (map->odom); the sim
# provides odom->base_link + /scan (frame base_link). Controller = Regulated Pure Pursuit
# with rotate-to-heading (matches our validated turn-in-place-then-drive, anti-tip).
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4
      # 40 s (was 15): SimpleProgressChecker only measures POSITION, and our
      # rotate-to-heading for a ~180 deg goal takes ~15-20 s of in-place rotation
      # (zero position change). At 15 s the checker aborted FollowPath mid-rotation
      # forever (root cause of the 2026-07-17 0/10 batch — see TEST_PLAN).
      movement_time_allowance: 40.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 0.45 (was 0.35): with realistic sensor noise the pose estimate jitters at the
      # tolerance boundary and runs "arrive but never declare" (measured: timeouts at
      # 0.41-0.86 m true error, 2026-07-15 batches). The L3.2 TRUE-error gate
      # (<0.8 m mean vs ground truth) stays the honest accuracy check — this knob
      # only lets Nav2 declare what it already achieved.
      xy_goal_tolerance: 0.45
      yaw_goal_tolerance: 0.5
      stateful: True
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.3 s (default 0.1): slam_toolbox's map->odom lags real time by ~50-150 ms on
      # this box; at 0.1 the controller threw "extrapolation into the future" on many
      # ticks, each emitting a ZERO command that reset the angular ramp -> rotation
      # never exceeded ~0.19 rad/s (measured 2026-07-17; the final rotate-to-heading
      # deadlock layer after the cascade fix).
      transform_tolerance: 0.3
      desired_linear_vel: 0.4
      lookahead_dist: 0.7
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.0
      rotate_to_heading_angular_vel: 0.7
      use_velocity_scaled_lookahead_dist: true
      # 4.0 (was 1.5): RPP ramps rotation from the MEASURED angular rate, +accel*dt
      # per tick. Skid-steer scrub stiction ignores commands below ~0.3 rad/s, so at
      # 1.5 the command ceiling locked at measured+0.075 ~= 0.19 rad/s — a quantitative
      # deadlock (observed 2026-07-17). 4.0 lets the command punch through the dead
      # zone in ~2 ticks; wheels+yaw-rate loop handle the step fine.
      max_angular_accel: 4.0
      use_rotate_to_heading: true          # turn in place first (anti-tip, validated)
      rotate_to_heading_min_angle: 0.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.7
    min_rotational_vel: 0.2
    rotational_acc_lim: 4.0   # match FollowPath.max_angular_accel (stiction dead zone)

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.4, 0.0, 0.7]
    min_velocity: [-0.2, 0.0, -0.7]
    max_accel: [1.0, 0.0, 4.0]   # angular matches FollowPath (stiction punch-through)
    max_decel: [-1.5, 0.0, -4.0]
    odom_topic: "/odom"
    odom_duration: 0.1

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5    # slam map->odom lags ~0.1s on this box (see FollowPath)
      robot_radius: 0.45
      resolution: 0.1
      # Rolling 40x40 window centered on the robot so goals in not-yet-mapped ground
      # are always ON the costmap. Unknown = free (open oil&gas pad); the obstacle
      # layer marks real obstacles from the live 10 m LiDAR, inflation keeps clearance.
      # slam_toolbox still builds /map alongside (the robot's persistent map).
      rolling_window: true
      width: 40
      height: 40
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.3
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.1
      robot_radius: 0.45
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          obstacle_max_range: 10.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
