# OFFICE overlay for nav2_params.yaml (applied by M20_SITE=office; merged into the
# STAGED copy only, so nav2_params.yaml stays single-source for the outdoor site).
# Why each value (measured from the vendor MJCF, docs/AI_NAV_RUNBOOK.md §7):
#  * footprint: the M20 at stance is 0.91 m long x 0.53 m wide. Outdoors a 0.45 m
#    circle was fine; indoors it makes every 0.8-0.9 m door "lethal" (needs 0.9 m).
#    With the real rectangle the inscribed radius is 0.27 m -> doors plan.
#  * inflation 0.35 / scaling 5: keep clearance cost near walls without closing doors.
#  * 0.3 m/s cap: walking pace among people; stopping distance at 1.5 m/s^2 ~3 cm.
controller_server:
  ros__parameters:
    FollowPath:
      max_vel_x: 0.3
      max_speed_xy: 0.3
velocity_smoother:
  ros__parameters:
    max_velocity: [0.3, 0.0, 0.6]
    min_velocity: [-0.15, 0.0, -0.6]
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: null          # null = delete key: footprint polygon is used instead
      footprint: "[[0.46, 0.27], [0.46, -0.27], [-0.46, -0.27], [-0.46, 0.27]]"
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: null
      footprint: "[[0.46, 0.27], [0.46, -0.27], [-0.46, -0.27], [-0.46, 0.27]]"
      footprint_padding: 0.03
      inflation_layer:
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
