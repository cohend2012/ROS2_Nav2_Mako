# L2 landmark registry for the oil_gas_field sim site (map frame = sim world frame;
# the anchored map's landmark gate puts map within ~0.23 m of world, maps/*.score.txt).
# Gauge entries carry ONLY scale + units — never the true value (that lives in
# tools/sim/gauges/truth.json for the G5 gate). Approach poses: the robot stands 1.2 m
# from the dial, camera facing it (generated by tools/sim/make_gauge_scene.py).
frame: map
landmarks:
  # --- gauges -------------------------------------------------------------------
  - {name: gauge_pg101, type: gauge, aliases: [PG-101, tank 1 pressure gauge, tank 1 gauge],
     position: [-5.0, 2.59], approach: [-5.0, 1.39, 1.5708], gauge: {units: psi, min: 0, max: 100}}
  - {name: gauge_pg102, type: gauge, aliases: [PG-102, tank 2 pressure gauge, tank 2 gauge],
     position: [-1.3, 3.12], approach: [-1.3, 1.92, 1.5708], gauge: {units: psi, min: 0, max: 100}}
  - {name: gauge_ti201, type: gauge, aliases: [TI-201, wellhead temperature, wellhead gauge],
     position: [5.59, -1.0], approach: [4.39, -1.0, 0.0], gauge: {units: degC, min: 0, max: 150}}
  - {name: gauge_pg301, type: gauge, aliases: [PG-301, skid 1 gauge],
     position: [-3.49, -1.0], approach: [-2.29, -1.0, 3.1416], gauge: {units: psi, min: 0, max: 200}}
  - {name: gauge_pg302, type: gauge, aliases: [PG-302, skid 2 gauge],
     position: [0.0, 1.09], approach: [0.0, -0.11, 1.5708], gauge: {units: bar, min: 0, max: 16}}
  - {name: gauge_fl401, type: gauge, aliases: [FL-401, pipe rack gauge, rack gauge],
     position: [5.0, 1.89], approach: [5.0, 0.69, 1.5708], gauge: {units: bar, min: 0, max: 10}}
  # --- equipment ------------------------------------------------------------------
  - {name: tank1, type: tank, aliases: [tank 1, storage tank 1, west tank],
     position: [-5.0, 4.0], approach: [-5.0, 1.6, 1.5708]}
  - {name: tank2, type: tank, aliases: [tank 2, storage tank 2],
     position: [-1.0, 4.5], approach: [-1.0, 2.1, 1.5708]}
  - {name: wellhead, type: wellhead, aliases: [well, wellhead valve, christmas tree],
     position: [6.0, -1.0], approach: [4.6, -1.0, 0.0]}
  - {name: pipe_rack, type: rack, aliases: [rack, pipe rack],
     position: [6.0, 2.0], approach: [6.0, 0.8, 1.5708]}
  - {name: skid1, type: skid, aliases: [skid 1, west skid, pump skid],
     position: [-4.0, -1.0], approach: [-2.6, -1.0, 3.1416]}
  - {name: skid2, type: skid, aliases: [skid 2, center skid],
     position: [0.0, 1.5], approach: [0.0, 0.2, 1.5708]}
  # --- areas (the patrol gate's goals) ---------------------------------------------
  - {name: west_field, type: area, aliases: [W field, west field], position: [-6.0, -0.5], approach: [-6.0, -0.5, 3.1416]}
  - {name: north_lane, type: area, aliases: [N lane, north lane], position: [2.5, 3.5], approach: [2.5, 3.5, 1.5708]}
  - {name: east_field, type: area, aliases: [E field, east field], position: [6.5, 0.2], approach: [6.5, 0.2, 0.0]}

# saved missions: "start the mission" runs default_routine
routines:
  morning_round:
    aliases: [the mission, morning round, rounds, gauge round]
    description: read every gauge (nearest-first order) and come back to the start
    steps:
      - {action: read_gauge, target: gauge_pg302}
      - {action: read_gauge, target: gauge_pg102}
      - {action: read_gauge, target: gauge_pg301}
      - {action: read_gauge, target: gauge_pg101}
      - {action: read_gauge, target: gauge_ti201}
      - {action: read_gauge, target: gauge_fl401}
      - {action: return_home}
  site_patrol:
    aliases: [patrol, site patrol, tour]
    description: drive the perimeter areas and come back
    steps:
      - {action: goto, target: west_field}
      - {action: goto, target: north_lane}
      - {action: goto, target: east_field}
      - {action: return_home}
default_routine: morning_round
