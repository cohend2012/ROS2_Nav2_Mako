slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # frames / topics (match the sim)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # map
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_publish_period: 0.05
    map_update_interval: 1.0

    # scan matching / motion
    use_scan_matching: true
    # 0.1 (was 0.2): with realistic sensor noise the pose must keep correcting during
    # slow final approach — at 0.2 the last update lands too far from the goal and the
    # goal checker starves (2 finish-line timeouts in the 2026-07-15 realism batch).
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 20
    link_match_minimum_response_fine: 0.1
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    transform_timeout: 0.2
    tf_buffer_duration: 10.0
